<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>Comandos | NYDo Wiki</title>
<link rel="stylesheet" href="style.css">
<link rel="stylesheet" href="busqueda.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
<style>
:root{
  --bg:#0a0b12;--surface:rgba(255,255,255,.035);--surface-2:rgba(255,255,255,.06);
  --bd:rgba(255,255,255,.08);--bd-2:rgba(255,255,255,.16);
  --red:#ff4d5e;--gold:#ffc83d;--txt:#e8ecf4;--mut:#98a2b8;--dim:#6b758c;
  --r:18px;--sp:clamp(16px,3vw,32px);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:100px}
body{margin:0;background:var(--bg);color:var(--txt);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.6;
  background-image:radial-gradient(ellipse 60% 40% at 10% 0%,rgba(177,94,255,.14),transparent 70%),radial-gradient(ellipse 50% 40% at 100% 100%,rgba(255,77,94,.09),transparent 70%);
  background-attachment:fixed;padding-bottom:env(safe-area-inset-bottom,0)}
button{font:inherit;color:inherit}

/* Header (igual que dojutsus) */
.nydo-header{position:sticky;top:0;z-index:100}
.topbar{display:flex;align-items:center;gap:15px;padding:10px 20px;background:rgba(9,10,15,.85)!important;border-bottom:1px solid var(--bd);position:relative;backdrop-filter:blur(16px);-webkit-backdrop-filter:blur(16px)}
.search{position:relative;width:min(420px,100%);display:block;margin:0 0 28px}
.search input{width:100%;padding:11px 16px 11px 42px;border-radius:999px;border:1px solid var(--bd);background:var(--surface-2);color:#fff;font:inherit;font-size:.92rem;outline:0;transition:border-color .2s,background .2s}
.search input:focus{border-color:var(--gold);background:rgba(255,255,255,.08)}
.search::before{content:"⌕";position:absolute;left:16px;top:50%;transform:translateY(-52%);color:var(--mut);font-size:1.1rem;pointer-events:none}

/* Layout */
.layout{max-width:1180px;margin:0 auto;padding:clamp(28px,5vw,48px) var(--sp) 40px;display:grid;grid-template-columns:230px minmax(0,1fr);gap:clamp(24px,4vw,56px);align-items:start}
.catnav{position:sticky;top:88px;display:flex;flex-direction:column;gap:4px}
.catnav h6{margin:0 0 8px 12px;font-size:.68rem;letter-spacing:.16em;color:var(--dim);font-weight:700}
.ctab{display:flex;align-items:center;gap:10px;width:100%;text-align:left;cursor:pointer;border:1px solid transparent;background:transparent;color:var(--mut);padding:9px 12px;border-radius:12px;font-size:.9rem;transition:background .2s,color .2s,border-color .2s}
.ctab:hover{background:var(--surface);color:var(--txt)}
.ctab .n{margin-left:auto;font-size:.72rem;color:var(--dim)}
.ctab.on{background:color-mix(in srgb,var(--c) 14%,transparent);border-color:color-mix(in srgb,var(--c) 45%,transparent);color:#fff}
.ctab.on .n{color:var(--c)}
.ctab:focus-visible,.head:focus-visible,.mini:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.tools{margin-top:18px;padding-top:18px;border-top:1px solid var(--bd)}
.mini{width:100%;cursor:pointer;border:1px solid var(--bd);background:var(--surface);padding:8px 12px;border-radius:12px;font-size:.82rem;color:var(--mut);transition:.2s}
.mini:hover{color:#fff;border-color:var(--bd-2)}

/* Category */
.cat{margin-bottom:clamp(40px,6vw,72px)}
.cat-h{display:flex;gap:16px;align-items:center;margin-bottom:28px}
.ico{flex:none;width:54px;height:54px;border-radius:16px;display:grid;place-items:center;font-size:1.6rem;background:color-mix(in srgb,var(--c) 16%,transparent);border:1px solid color-mix(in srgb,var(--c) 40%,transparent)}
.cat-h small{color:var(--c);letter-spacing:.14em;font-weight:700;font-size:.68rem}
.cat-h h2{margin:2px 0 2px;font-size:1.6rem;color:#fff;letter-spacing:-.01em}
.cat-h p{margin:0;color:var(--mut);font-size:.92rem}

.grp{margin-top:30px}
.grp-t{display:flex;align-items:center;gap:12px;margin:0 0 12px 4px;font:700 .82rem "Courier New",monospace;color:var(--c);letter-spacing:.02em}
.grp-t::after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--bd),transparent)}
.grp-t span{color:var(--dim);font-weight:400}
.list{display:flex;flex-direction:column;gap:10px}

/* Command card */
.cmd{background:var(--surface);border:1px solid var(--bd);border-radius:var(--r);transition:border-color .25s,background .25s,box-shadow .25s}
.cmd:hover{border-color:var(--bd-2);background:var(--surface-2)}
.cmd.open{border-color:color-mix(in srgb,var(--c) 55%,transparent);background:var(--surface-2);box-shadow:0 12px 40px rgba(0,0,0,.35)}
.head{display:flex;align-items:flex-start;gap:14px;width:100%;padding:16px 18px;border:0;background:none;text-align:left;cursor:pointer;border-radius:var(--r)}
.info{flex:1;min-width:0}
.line{display:flex;align-items:center;flex-wrap:wrap;gap:6px 10px}
code.sx{font:600 .95rem "Courier New",ui-monospace,monospace;color:#fff;word-break:break-word}
code.sx i{font-style:normal;color:var(--c)}
code.sx .rq{color:var(--gold)}
code.sx .op{color:var(--dim);font-weight:400}
.desc{margin:6px 0 0;color:var(--mut);font-size:.9rem}
.tg{font-size:.66rem;letter-spacing:.05em;border-radius:999px;padding:2px 9px;border:1px solid currentColor;opacity:.85;font-weight:600}
.tg.op{color:var(--red)}.tg.pl{color:#5ee27a}.tg.cl{color:#4fd8ff}.tg.db{color:var(--gold)}
.chev{flex:none;margin-top:4px;width:22px;height:22px;display:grid;place-items:center;color:var(--dim);transition:transform .3s,color .2s}
.cmd:hover .chev{color:var(--txt)}
.cmd.open .chev{transform:rotate(180deg);color:var(--c)}
.cp{flex:none;border:1px solid var(--bd);background:transparent;border-radius:10px;padding:4px 10px;font-size:.74rem;color:var(--mut);cursor:pointer;transition:.2s}
.cp:hover{color:#fff;border-color:var(--bd-2)}

/* Demo */
.demo-w{display:grid;grid-template-rows:0fr;transition:grid-template-rows .35s ease}
.cmd.open .demo-w{grid-template-rows:1fr}
.demo-in{overflow:hidden;min-height:0}
.demo{margin:0 18px 18px;border-radius:14px;border:1px solid var(--bd);overflow:hidden;background:#05060a}
.demo-bar{display:flex;align-items:center;gap:6px;padding:8px 12px;background:rgba(255,255,255,.04);border-bottom:1px solid var(--bd);font-size:.7rem;color:var(--dim)}
.demo-bar i{width:9px;height:9px;border-radius:50%;background:var(--dim);opacity:.5}
.demo-bar button{margin-left:auto;border:0;background:none;color:var(--c);cursor:pointer;font-size:.74rem;font-weight:700}
.chat{padding:14px 16px 8px;min-height:92px;display:flex;flex-direction:column;gap:3px;font:.82rem/1.55 "Courier New",ui-monospace,monospace}
.chat div{color:#d7e0d7;white-space:pre-wrap;word-break:break-word;animation:in .3s ease both}
.chat .y{color:#ffe066}.chat .g{color:#6ee787}.chat .r{color:#ff6b6b}
@keyframes in{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
.inp{margin:6px 12px 12px;padding:6px 10px;border:1px solid var(--bd);border-radius:8px;font:.8rem "Courier New",monospace;color:#fff;white-space:nowrap;overflow:hidden;background:rgba(255,255,255,.03)}
.inp i{display:inline-block;width:6px;height:12px;background:#fff;vertical-align:middle;margin-left:1px;animation:b 1s steps(1) infinite}
@keyframes b{50%{opacity:0}}

.none{text-align:center;color:var(--mut);padding:80px 20px}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);opacity:0;background:#1d2233;border:1px solid var(--bd-2);padding:8px 18px;border-radius:999px;font-size:.85rem;pointer-events:none;transition:.3s;z-index:99}
.toast.on{opacity:1;transform:translate(-50%,0)}
footer{max-width:1180px;margin:0 auto;padding:24px var(--sp) 56px;color:var(--dim);font-size:.82rem;border-top:1px solid var(--bd)}

@media(max-width:860px){
  .layout{grid-template-columns:1fr;gap:20px}
  .catnav{position:static;flex-direction:row;overflow-x:auto;gap:8px;padding-bottom:6px;margin:0 calc(var(--sp) * -1);padding-inline:var(--sp);scrollbar-width:none}
  .catnav::-webkit-scrollbar{display:none}
  .catnav h6,.tools{display:none}
  .ctab{width:auto;flex:none;border-color:var(--bd);white-space:nowrap;padding:8px 14px;border-radius:999px}
  .ctab .n{display:none}
}
@media(max-width:520px){
  .head{padding:14px}.demo{margin:0 14px 14px}.cp{display:none}
}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>
</head>

const cats=[];let cur;
D.split('\n').forEach(l=>{
  if(l[0]=='#'){const[i,n,e,c,d]=l.slice(1).split('|');cur={i,n,e,c,d,k:[]};cats.push(cur)}
  else{const[c,d,o]=l.split('|');cur.k.push({c,d,o:(o||'').split('~')})}
});

const tabs=document.getElementById('tabs'),main=document.getElementById('main'),q=document.getElementById('q'),toast=document.getElementById('toast');
let sel='all',allOpen=false;
const esc=s=>s.replace(/[&<>]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[m]));
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const groupOf=c=>c.split(' ')[0];

function tag(c){
  let t=/^\/(test|nydocinematic|nydovfx|nyitem|nygreat|nybendy)/.test(c)?'<span class="tg cl">CLIENTE</span>':'<span class="tg op">OP 2</span>';
  if(/^\/nyclan (create|invite|accept|reject|leave|info|list)/.test(c)||/^\/nydotutorial/.test(c))t='<span class="tg pl">JUGADOR</span>';
  if(/^\/(test|nydobiju|nydoclash)/.test(c))t+='<span class="tg db">DEBUG</span>';
  return t;
}
function syntax(c){
  const parts=esc(c).split(' ');
  return parts.map((p,i)=>{
    if(i==0)return '<i>'+p+'</i>';
    if(p.startsWith('&lt;'))return '<span class="rq">'+p+'</span>';
    if(p.startsWith('['))return '<span class="op">'+p+'</span>';
    return p;
  }).join(' ');
}

function render(){
  const f=q.value.trim().toLowerCase();
  let h='',tot=0;
  cats.forEach(c=>{
    if(sel!='all'&&sel!=c.i)return;
    const ks=c.k.filter(x=>!f||(x.c+' '+x.d).toLowerCase().includes(f));
    if(!ks.length)return;
    tot+=ks.length;
    const groups={};ks.forEach(x=>(groups[groupOf(x.c)]=groups[groupOf(x.c)]||[]).push(x));
    h+=`<section class="cat" style="--c:${c.c}" id="${c.i}"><div class="cat-h"><div class="ico">${c.e}</div><div><small>${ks.length} COMANDOS</small><h2>${c.n}</h2><p>${c.d}</p></div></div>`;
    Object.entries(groups).forEach(([g,items])=>{
      h+=`<div class="grp"><h3 class="grp-t">${esc(g)} <span>${items.length}</span></h3><div class="list">`;
      items.forEach(x=>{
        h+=`<article class="cmd${allOpen?' open':''}" data-c="${esc(x.c)}" data-o="${esc(x.o.join('~'))}">
<button class="head" aria-expanded="${allOpen}"><div class="info"><div class="line"><code class="sx">${syntax(x.c)}</code>${tag(x.c)}</div><p class="desc">${esc(x.d)}</p></div><span class="chev" aria-hidden="true"><svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 6l5 5 5-5"/></svg></span></button>
<div class="demo-w"><div class="demo-in"><div class="demo"><div class="demo-bar"><i></i><i></i><i></i><span>&nbsp;chat</span><button class="rep" type="button">↻ Repetir</button><button class="cp" type="button" style="margin-left:8px">Copiar</button></div><div class="chat"></div><div class="inp">&gt; <span></span><i></i></div></div></div></div></article>`;
      });
      h+='</div></div>';
    });
    h+='</section>';
  });
  main.innerHTML=h||'<div class="none">No se encontró ningún comando.</div>';
  if(allOpen)main.querySelectorAll('.cmd').forEach(play);
}

async function play(card){
  const id=(card._id=(card._id||0)+1),ch=card.querySelector('.chat'),sp=card.querySelector('.inp span');
  ch.innerHTML='';sp.textContent='';
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  for(const c of card.dataset.c){if(card._id!=id)return;sp.textContent+=c;if(!reduce)await sleep(18)}
  await sleep(reduce?0:300);if(card._id!=id)return;
  const e=document.createElement('div');e.className='y';e.textContent='<Tú> '+card.dataset.c;ch.appendChild(e);sp.textContent='';
  await sleep(reduce?0:260);
  for(const ln of card.dataset.o.split('~')){
    if(card._id!=id)return;
    const d=document.createElement('div');d.className=/rechaz|No se|no está/i.test(ln)?'r':'g';d.textContent=ln;ch.appendChild(d);
    await sleep(reduce?0:220);
  }
}

function showToast(t){toast.textContent=t;toast.classList.add('on');clearTimeout(showToast.t);showToast.t=setTimeout(()=>toast.classList.remove('on'),1400)}

main.addEventListener('click',e=>{
  const card=e.target.closest('.cmd');if(!card)return;
  if(e.target.closest('.cp')){
    const txt=card.dataset.c;
    (navigator.clipboard?navigator.clipboard.writeText(txt):Promise.reject()).then(()=>showToast('Comando copiado')).catch(()=>showToast('No se pudo copiar'));
    return;
  }
  if(e.target.closest('.rep')){play(card);return}
  if(e.target.closest('.head')){
    const open=card.classList.toggle('open');
    card.querySelector('.head').setAttribute('aria-expanded',open);
    if(open)play(card);else card._id=(card._id||0)+1;
  }
});

function buildTabs(){
  const total=cats.reduce((a,c)=>a+c.k.length,0);
  const items=[{i:'all',n:'Todos',e:'⌨',c:'#ffc83d',k:{length:total}}].concat(cats);
  tabs.innerHTML='<h6>CATEGORÍAS</h6>'+items.map(t=>`<button class="ctab${t.i==sel?' on':''}" data-i="${t.i}" style="--c:${t.c}"><span>${t.e}</span>${t.n}<span class="n">${t.k.length}</span></button>`).join('')
   +'<div class="tools"><button class="mini" id="exp" type="button">Expandir todas las demos</button></div>';
}
tabs.addEventListener('click',e=>{
  if(e.target.closest('#exp')){
    allOpen=!allOpen;e.target.closest('#exp').textContent=allOpen?'Plegar todas las demos':'Expandir todas las demos';render();return;
  }
  const b=e.target.closest('.ctab');if(!b)return;
  sel=b.dataset.i;tabs.querySelectorAll('.ctab').forEach(x=>x.classList.toggle('on',x==b));render();
  window.scrollTo({top:document.querySelector('.layout').offsetTop-80,behavior:'smooth'});
});
q.addEventListener('input',render);
buildTabs();render();
</script>
